<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正多角形で円周率に迫る</title>

<style>
body{
    font-family:sans-serif;
    background:#f5f7fa;
    text-align:center;
    margin:0;
    padding:20px;
}

h1{
    color:#204060;
}

.panel{
    background:white;
    max-width:900px;
    margin:10px auto;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

canvas{
    background:white;
    border:1px solid #ccc;
    max-width:100%;
}

button{
    font-size:18px;
    padding:8px 16px;
    margin:5px;
}

#mission{
    font-size:22px;
    font-weight:bold;
}

.success{
    color:green;
    font-size:28px;
    font-weight:bold;
}

.step{
    font-size:20px;
    font-weight:bold;
    color:#204060;
}
</style>
</head>
<body>

<h1>正多角形で円周率に迫る</h1>

<div class="panel">
<div id="mission">
ミッション： π > 3.05 を証明せよ
</div>
</div>

<div class="panel">
<button onclick="prevStep()">◀ STEP</button>
<span class="step" id="stepLabel"></span>
<button onclick="nextStep()">STEP ▶</button>
</div>

<div class="panel">
<button onclick="decreaseN()">−</button>
<span id="nLabel">n = 6</span>
<button onclick="increaseN()">＋</button>
</div>

<div class="panel">
<canvas id="canvas" width="650" height="650"></canvas>
</div>

<div class="panel" id="message"></div>

<script>

let n=6;
let step=1;

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

function increaseN(){
    if(n<60){
        n++;
        draw();
    }
}

function decreaseN(){
    if(n>3){
        n--;
        draw();
    }
}

function nextStep(){
    if(step<8){
        step++;
        draw();
    }
}

function prevStep(){
    if(step>1){
        step--;
        draw();
    }
}

function draw(){

document.getElementById("nLabel").innerHTML=
"n = "+n;

ctx.clearRect(0,0,650,650);

const cx=325;
const cy=325;
const R=230;

const pts=[];

for(let i=0;i<n;i++){

let t=
-Math.PI/2+
2*Math.PI*i/n;

pts.push({
x:cx+R*Math.cos(t),
y:cy+R*Math.sin(t)
});
}

ctx.beginPath();
ctx.arc(cx,cy,R,0,2*Math.PI);
ctx.strokeStyle="#777";
ctx.stroke();

ctx.beginPath();

ctx.moveTo(pts[0].x,pts[0].y);

for(let i=1;i<n;i++){
ctx.lineTo(pts[i].x,pts[i].y);
}

ctx.closePath();

ctx.strokeStyle="blue";
ctx.lineWidth=2;
ctx.stroke();

if(step>=4){

ctx.beginPath();
ctx.moveTo(pts[0].x,pts[0].y);
ctx.lineTo(pts[1].x,pts[1].y);

ctx.strokeStyle="red";
ctx.lineWidth=6;
ctx.stroke();

}

if(step>=5){

ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(pts[0].x,pts[0].y);
ctx.strokeStyle="green";
ctx.stroke();

ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(pts[1].x,pts[1].y);
ctx.strokeStyle="green";
ctx.stroke();

ctx.fillText("O",cx+8,cy-8);
}

const thetaDeg=360/n;

const side=
Math.sqrt(
2-2*Math.cos(
2*Math.PI/n
)
);

const perimeter=
n*side;

const lower=
perimeter/2;

let msg="";
let label="";

if(step===1){

label="STEP1";

msg=`
正六角形は円の内側にあります。

円周と正六角形の周長は、
どちらが長いでしょうか？
`;

}

if(step===2){

label="STEP2";

msg=`
正六角形の1辺は1です。

周長は6です。

円周の長さについて、
πに関する不等式を考えてみましょう。
`;

}

if(step===3){

label="STEP3";

msg=`
nを1ずつ増やしてみよう。

正多角形の周長は
だんだん円周に近づいていくだろうか？
`;

}

if(step===4){

label="STEP4";

msg=`
赤い辺に注目。

周長を求めるには、
まず何が分かればよいだろう？
`;

}

if(step===5){

label="STEP5";

msg=`
OA=OB=1

中心角は

${thetaDeg.toFixed(2)}°

です。

赤い辺の長さは
どう求められそうですか？
`;

}

if(step===6){

label="STEP6";

msg=`
二等辺三角形に注目。

辺が

1,1,s

の三角形です。

使えそうな公式は？
`;

}

if(step===7){

label="STEP7";

msg=`
s²

=
1²+1²
−2cos(360°/n)

<br><br>

s

=
${side.toFixed(5)}
`;

}

if(step===8){

label="STEP8";

msg=`

周長

Pn = ${perimeter.toFixed(5)}

<br><br>

Pn/2 = ${lower.toFixed(5)}

<br><br>

したがって

π > ${lower.toFixed(5)}

`;

if(lower>3.05){

msg +=
"<br><br><div class='success'>MISSION CLEAR!</div>";
}

}

document.getElementById("stepLabel").innerHTML=label;
document.getElementById("message").innerHTML=msg;

}

draw();

</script>

</body>
</html>
